services:
  app:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8765"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
