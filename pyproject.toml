[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compiler-error-detection-data-engine"
version = "1.0.0"
description = "Data Engineer pipeline for AI-Based Compiler Error Detection and Repair"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Data Engineering Team", email = "data-eng@compiler-ai.local" }
]
keywords = ["compiler", "error-detection", "program-repair", "mutation-testing", "dataset-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "pycparser>=2.20",
    "parso>=0.8.0",
    "pyflakes>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]
mining = [
    "pydriller>=2.5.0",
]
analysis = [
    "mypy>=1.10.0",
]

[project.scripts]
data-engine = "src.data_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "compiler: tests that require external compiler (gcc / g++)",
    "integration: end-to-end integration tests",
    "slow: tests that take longer to run",
]
